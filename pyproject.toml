[project]
name = "nblm2obsidian"
version = "0.1.0"
description = "Import publicly shared Google NotebookLM notebooks into Obsidian vaults"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
    "notebooklm-py>=0.8",
    "tenacity>=8.0",
]

[project.scripts]
nblm2obsidian = "nblm2obsidian.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]